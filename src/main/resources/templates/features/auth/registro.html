<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear cuenta | Viajo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/autenticacion/registro.css}">
</head>

<body class="registro-page">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="registro-container">

    <section class="registro-image">

      <div class="registro-image-content">

        <span>ÚNETE A VIAJO</span>

        <h1>El mundo es demasiado grande para quedarse en un solo lugar.</h1>

        <p>
          Forma parte de una comunidad de viajeros,
          descubre destinos y comparte tus mejores experiencias.
        </p>

      </div>

    </section>

    <section class="registro-form-section">

      <div class="registro-card">

        <div class="registro-heading">

          <span class="registro-icon">🌍</span>

          <h2>Crea tu cuenta</h2>

          <p>Comienza a descubrir nuevas experiencias.</p>

        </div>

        <!-- MENSAJES -->
        <div id="mensajeRegistro" class="alert d-none" role="alert"></div>

        <form id="registroForm">

          <!-- NOMBRES -->
          <div class="registro-row">

            <div class="registro-field">
              <label for="nombres">Nombre</label>

              <input type="text" id="nombres" name="nombres" class="form-control" placeholder="Tu nombre"
                autocomplete="given-name" maxlength="100" required>
            </div>

            <div class="registro-field">
              <label for="apellidos">Apellido</label>

              <input type="text" id="apellidos" name="apellidos" class="form-control" placeholder="Tu apellido"
                autocomplete="family-name" maxlength="100" required>
            </div>

          </div>

          <!-- USUARIO -->
          <div class="registro-field">

            <label for="usuario">Nombre de usuario</label>

            <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ej. viajero123"
              autocomplete="username" maxlength="50" required>

          </div>

          <!-- CORREO -->
          <div class="registro-field">

            <label for="correo">Correo electrónico</label>

            <input type="email" id="correo" name="correo" class="form-control" placeholder="ejemplo@correo.com"
              autocomplete="email" maxlength="254" required>

          </div>

          <!-- CONTRASEÑA -->
          <div class="registro-field">

            <label for="contrasena">Contraseña</label>

            <div class="registro-password">

              <input type="password" id="contrasena" name="contrasena" class="form-control"
                placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>

              <button type="button" class="registro-toggle" data-target="contrasena">
                Ver
              </button>

            </div>

          </div>

          <!-- CONFIRMAR CONTRASEÑA -->
          <div class="registro-field">

            <label for="confirmarContrasena">
              Confirmar contraseña
            </label>

            <div class="registro-password">

              <input type="password" id="confirmarContrasena" name="confirmarContrasena" class="form-control"
                placeholder="Repite tu contraseña" autocomplete="new-password" required>

              <button type="button" class="registro-toggle" data-target="confirmarContrasena">
                Ver
              </button>

            </div>

            <small id="mensajePassword"></small>

          </div>

          <!-- TERMINOS -->
          <div class="registro-terminos">

            <input type="checkbox" id="aceptarTerminos" required>

            <label for="aceptarTerminos">
              Acepto los términos y condiciones
              y la política de privacidad.
            </label>

          </div>

          <!-- BOTON -->
          <button type="submit" id="btnRegistro" class="btn-registro">
            Crear mi cuenta
          </button>

        </form>

        <div class="registro-login">

          <p>
            ¿Ya tienes una cuenta?
            <a th:href="@{/login}">Inicia sesión</a>
          </p>

        </div>

      </div>

    </section>

  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/autenticacion/registro.js}"></script>

</body>

</html>
