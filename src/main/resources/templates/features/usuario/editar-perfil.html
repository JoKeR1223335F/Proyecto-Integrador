<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Editar perfil | Viajo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/usuario/usuario.css}">
</head>

<body class="usuario-page" th:attr="data-usuario-id=${usuarioId}">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container py-5">

    <div class="formulario-perfil">

      <div class="mb-4">
        <span class="perfil-tag">CONFIGURACIÓN</span>
        <h1>Editar mi perfil</h1>
        <p class="text-muted">
          Mantén actualizada tu información personal.
        </p>
      </div>

      <div id="mensaje" class="alert d-none"></div>

      <form id="editarPerfilForm">

        <div class="row g-3">

          <div class="col-md-6">
            <label for="nombres" class="form-label">Nombres</label>
            <input type="text" id="nombres" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input type="text" id="apellidos" class="form-control" required>
          </div>

          <div class="col-12">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" id="correo" class="form-control" required>
          </div>

          <div class="col-12">
            <label for="usuario" class="form-label">Nombre de usuario</label>
            <input type="text" id="usuario" class="form-control" required>
          </div>

          <div class="col-12">
            <label for="estado" class="form-label">Estado</label>
            <select id="estado" class="form-select">
              <option value="A">Activo</option>
              <option value="I">Inactivo</option>
            </select>
          </div>

        </div>

        <div class="alert alert-info mt-4">
          La contraseña no se modifica desde este formulario.
          Para cambiarla, utiliza el procedimiento de cambio de contraseña.
        </div>

        <div class="d-flex gap-2 mt-4">

          <button type="submit" class="btn btn-primary" id="btnGuardar">
            Guardar cambios
          </button>

          <a th:href="@{/usuario}" class="btn btn-outline-secondary">
            Cancelar
          </a>

        </div>

      </form>

    </div>

  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script th:src="@{/js/usuario/editar-perfil.js}"></script>

</body>

</html>
