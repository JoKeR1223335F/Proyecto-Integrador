spring:
  application:
    name: Proyecto-Viajo

  datasource:
    url: jdbc:postgresql://localhost:5432/proyecto_viajo
    username: viajo_user
    password: viajo_password
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cloudinary:
  cloud-name: $MI_NAME
  api-key: $MIAPIKEY
  api-secret: $MIAPUSECRET
