databaseChangeLog:
  # ============================================================
  # 1. Administradores del sistema
  # ============================================================
  - changeSet:
      id: 002-01-administrador
      author: viajo
      changes:
        - createTable:
            tableName: administrador
            columns:
              - column:
                  name: id_administrador
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_administrador
                    nullable: false
              - column:
                  name: id_rol
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: usuario
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_administrador_usuario
              - column:
                  name: correo
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_administrador_correo
              - column:
                  name: contrasena_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: nombre_completo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: ACTIVO
                  constraints:
                    nullable: false
              - column:
                  name: intentos_fallidos
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: ultimo_acceso
                  type: TIMESTAMP
              - column:
                  name: creado_en
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: actualizado_en
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: administrador
            baseColumnNames: id_rol
            constraintName: fk_administrador_rol
            referencedTableName: rol
            referencedColumnNames: id_rol
            onUpdate: CASCADE
            onDelete: RESTRICT

        - sql:
            sql: |
              ALTER TABLE administrador
                ADD CONSTRAINT chk_administrador_estado
                  CHECK (estado IN ('ACTIVO', 'INACTIVO', 'BLOQUEADO')),
                ADD CONSTRAINT chk_administrador_intentos
                  CHECK (intentos_fallidos >= 0),
                ADD CONSTRAINT chk_administrador_correo_formato
                  CHECK (
                    correo ~* '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
                  );

      rollback:
        - dropTable:
            tableName: administrador
            cascadeConstraints: true

  # ============================================================
  # 2. Usuarios de la aplicación
  # ============================================================
  - changeSet:
      id: 002-02-usuario
      author: viajo
      changes:
        - createTable:
            tableName: usuario
            columns:
              - column:
                  name: id_usuario
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_usuario
                    nullable: false
              - column:
                  name: id_rol
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: nombres
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: apellidos
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: correo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_usuario_correo
              - column:
                  name: usuario
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_usuario_cuenta
              - column:
                  name: contrasena_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: estado
                  type: VARCHAR(1)
                  defaultValue: A
                  constraints:
                    nullable: false
              - column:
                  name: fecha_registro
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: usuario
            baseColumnNames: id_rol
            constraintName: fk_usuario_rol
            referencedTableName: rol
            referencedColumnNames: id_rol
            onUpdate: CASCADE
            onDelete: RESTRICT

        - sql:
            sql: |
              ALTER TABLE usuario
                ADD CONSTRAINT chk_usuario_estado
                  CHECK (estado IN ('A', 'I', 'B')),
                ADD CONSTRAINT chk_usuario_correo_formato
                  CHECK (
                    correo ~* '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
                  );

      rollback:
        - dropTable:
            tableName: usuario
            cascadeConstraints: true
