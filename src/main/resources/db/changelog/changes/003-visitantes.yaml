databaseChangeLog:
  - changeSet:
      id: 003-01-crear-visitante
      author: proyecto_viajo
      comment: "Crea el perfil del visitante asociado a un usuario"
      changes:
        - createTable:
            tableName: visitante
            remarks: "Perfil de visitante y tipo de turismo preferido actualmente"
            columns:
              - column:
                  name: id_visitante
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_visitante
                    nullable: false

              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_visitante_usuario

              - column:
                  name: id_tipo_turismo
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: telefono
                  type: VARCHAR(20)

              - column:
                  name: pais_residencia
                  type: VARCHAR(100)

              - column:
                  name: fecha_nacimiento
                  type: DATE

              - column:
                  name: creado_en
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: visitante
            baseColumnNames: id_usuario
            constraintName: fk_visitante_usuario
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: visitante
            baseColumnNames: id_tipo_turismo
            constraintName: fk_visitante_tipo_turismo
            referencedTableName: tipo_turismo
            referencedColumnNames: codigo
            onDelete: RESTRICT

        - sql:
            comment: "Valida que la fecha de nacimiento no sea futura"
            sql: |
              ALTER TABLE visitante
              ADD CONSTRAINT chk_visitante_fecha_nacimiento
              CHECK (
                fecha_nacimiento IS NULL
                OR fecha_nacimiento <= CURRENT_DATE
              );

      rollback:
        - dropTable:
            tableName: visitante
            cascadeConstraints: true

  - changeSet:
      id: 003-02-crear-preferencia-visitante
      author: proyecto_viajo
      comment: "Registra el historial de preferencias turísticas del visitante"
      changes:
        - createTable:
            tableName: preferencia_visitante
            remarks: "Historial de tipos de turismo elegidos por cada visitante"
            columns:
              - column:
                  name: id_preferencia
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_preferencia_visitante
                    nullable: false

              - column:
                  name: id_visitante
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: id_tipo_turismo
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: fecha_inicio
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: fecha_fin
                  type: TIMESTAMP WITHOUT TIME ZONE

              - column:
                  name: activa
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: preferencia_visitante
            baseColumnNames: id_visitante
            constraintName: fk_preferencia_visitante_visitante
            referencedTableName: visitante
            referencedColumnNames: id_visitante
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: preferencia_visitante
            baseColumnNames: id_tipo_turismo
            constraintName: fk_preferencia_visitante_tipo_turismo
            referencedTableName: tipo_turismo
            referencedColumnNames: codigo
            onDelete: RESTRICT

        - sql:
            comment: "Impide rangos de fechas inválidos"
            sql: |
              ALTER TABLE preferencia_visitante
              ADD CONSTRAINT chk_preferencia_fechas
              CHECK (
                fecha_fin IS NULL
                OR fecha_fin >= fecha_inicio
              );

        - sql:
            comment: "Un visitante solo puede tener una preferencia activa"
            sql: |
              CREATE UNIQUE INDEX uq_preferencia_visitante_activa
              ON preferencia_visitante (id_visitante)
              WHERE activa = TRUE;

      rollback:
        - dropTable:
            tableName: preferencia_visitante
            cascadeConstraints: true
