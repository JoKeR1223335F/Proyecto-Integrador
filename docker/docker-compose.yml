services:
  postgres:
    image: postgres:17
    container_name: proyecto_viajo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proyecto_viajo
      POSTGRES_USER: viajo_user
      POSTGRES_PASSWORD: viajo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajo_user -d proyecto_viajo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
